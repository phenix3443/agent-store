[package]
name = "app"
version = "0.2.2"
description = "Desktop client for Agent Store: install and manage skills, MCP servers and model providers for Claude Code and Codex"
authors = ["phenix3443"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
# 2.8 needs Rust 1.90; rust-toolchain.toml pins 1.85.
tauri-plugin-dialog = "~2.7"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# deep-link: a second launch carrying agent-store:// hands the URL to the running
# instance's onOpenUrl instead of opening another window (#68).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
