<script>
(function () {
  var $ = AS.$, $$ = AS.$$, EN = AS_LANG === 'en';
  function mount(id, view, h) { var el = $(id); el.className = 'app-main'; el.style.height = h + 'px'; AS.mountView(el, view); }
  mount('#vSkills', 'skills', 440); mount('#vMcp', 'mcp', 400); mount('#vUsage', 'usage', 400);

  /* 一份技能，每个 agent 一行开关；以后支持更多 agent 时在这里加行 */
  var TOOLS = [['claude', '~/.claude/skills/tdd', true], ['codex', '~/.codex/skills/tdd', false]];
  $('#linksD').innerHTML = TOOLS.map(function (x, i) {
    return '<div class="ld-row' + (x[2] ? ' on' : '') + '" data-tool="' + x[0] + '"><div class="ld-node src">~/.agent-store/skills/tdd/<small>' + t(i ? 'cl.1.src2' : 'cl.1.src') + '</small></div><div class="ld-wire"></div><div class="ld-node dst">' + x[1] + '<small>' + t('cl.1.reads', { tool: AS.TOOL[x[0]] }) + '</small></div></div>';
  }).join('') + '<div class="ld-ctl">' + TOOLS.map(function (x) {
    var l = t('cl.1.sw', { tool: AS.TOOL[x[0]] });
    return '<span class="tool-sw"><button type="button" class="switch" role="switch" aria-checked="' + x[2] + '" aria-label="' + l + '" data-for="' + x[0] + '"></button>' + l + '</span>';
  }).join('') + '</div>';
  $('#linksD').addEventListener('as:switch', function (e) {
    var on = e.target.getAttribute('aria-checked') === 'true', tool = e.target.dataset.for;
    $('.ld-row[data-tool="' + tool + '"]', this).classList.toggle('on', on);
    AS.toast(t(on ? 'cl.1.on' : 'cl.1.off', { tool: AS.TOOL[tool] }));
  });
  $('#tryInstall').addEventListener('click', function () { AS.install('builtin:openrouter', this); });
  $('#faq').innerHTML = [1, 2, 3, 4, 5, 6].map(function (n, i) {
    return '<details' + (i ? '' : ' open') + '><summary>' + t('faq.' + n + '.q') + (EN ? '?' : '？') + '</summary><p>' + AS.link(t('faq.' + n + '.a'), '<a href="download.html#first-run" style="text-decoration:underline">') + '</p></details>';
  }).join('');

  /* 供应商顺序与请求流向 */
  var provList = $('#provList'), host = $('#flow'), log = $('#flowLog'), NS = 'http://www.w3.org/2000/svg';
  var run = 0, vertical = null, G = {};
  provList.innerHTML = AS.provRows();
  function el(tag, attrs, parent, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; (parent || G.svg).appendChild(e); return e; }
  function node(x, y, w, h, title, sub, cls) {
    var g = el('g', { class: 'node ' + (cls || '') });
    el('rect', { x: x, y: y, width: w, height: h, rx: 12 }, g);
    el('text', { x: x + w / 2, y: y + h / 2 - (sub ? 3 : -5), 'text-anchor': 'middle' }, g, title);
    var s = sub != null ? el('text', { x: x + w / 2, y: y + h / 2 + 15, 'text-anchor': 'middle', class: 's' }, g, sub) : null;
    return { g: g, sub: s, base: sub };
  }
  function build() {
    var v = host.clientWidth < 520, names = AS.provNames(), tools = ['Claude Code', 'Codex'];
    vertical = v; host.innerHTML = '';
    G.svg = document.createElementNS(NS, 'svg'); G.svg.setAttribute('class', 'flow'); G.svg.setAttribute('viewBox', v ? '0 0 340 420' : '0 0 760 330'); host.appendChild(G.svg);
    G.tw = []; G.pw = []; G.prov = [];
    if (v) {
      tools.forEach(function (x, i) { var px = 10 + i * 170; G.tw.push(el('path', { class: 'wire', d: 'M' + (px + 75) + ',60 C' + (px + 75) + ',105 170,105 170,150' })); });
      names.forEach(function (n, i) { var px = 56 + i * 114; G.pw.push(el('path', { class: 'wire', d: 'M170,230 C170,285 ' + px + ',285 ' + px + ',340' })); });
      tools.forEach(function (x, i) { node(10 + i * 170, 10, 150, 50, x); });
      G.relay = node(70, 150, 200, 80, t('cl.4.relay'), '127.0.0.1:18780', 'relay');
      names.forEach(function (n, i) { G.prov.push(node(4 + i * 114, 340, 104, 64, n, 'Level ' + (i + 1))); });
    } else {
      tools.forEach(function (x, i) { var y = 97 + i * 136; G.tw.push(el('path', { class: 'wire', d: 'M160,' + y + ' C225,' + y + ' 225,165 290,165' })); });
      names.forEach(function (n, i) { var y = 57 + i * 108; G.pw.push(el('path', { class: 'wire', d: 'M460,165 C525,165 525,' + y + ' 590,' + y })); });
      tools.forEach(function (x, i) { node(10, 70 + i * 136, 150, 54, x); });
      G.relay = node(290, 110, 170, 110, t('cl.4.relay'), '127.0.0.1:18780', 'relay');
      names.forEach(function (n, i) { G.prov.push(node(590, 30 + i * 108, 160, 54, n, 'Level ' + (i + 1))); });
    }
    G.pkt = el('circle', { r: 5, class: 'pkt', fill: '#fff', opacity: 0 });
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function travel(path, color, id) {
    return new Promise(function (res) {
      var len = path.getTotalLength(), t0 = performance.now(), dur = 720;
      path.classList.add('lit'); path.style.setProperty('--c', color);
      G.pkt.setAttribute('fill', color); G.pkt.style.color = color; G.pkt.setAttribute('opacity', 1);
      (function step(now) {
        if (id !== run) return res(false);
        var k = Math.min(1, (now - t0) / dur), p = path.getPointAtLength(len * (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2));
        G.pkt.setAttribute('cx', p.x); G.pkt.setAttribute('cy', p.y);
        if (k < 1) requestAnimationFrame(step); else res(true);
      })(t0);
    });
  }
  function mark(p, cls, text) { p.g.classList.remove('ok', 'err'); if (cls) p.g.classList.add(cls); p.sub.textContent = text || p.base; }
  function clear() { $$('.wire', G.svg).forEach(function (w) { w.classList.remove('lit'); }); G.prov.forEach(function (p) { mark(p); }); G.pkt.setAttribute('opacity', 0); }
  function say(tool, to, code, ok) { var li = document.createElement('li'); li.innerHTML = '<b>' + tool + '</b><span>→ ' + to + '</span><span class="' + (ok ? 'ok' : 'er') + '">' + code + '</span>'; log.appendChild(li); while (log.children.length > 3) log.removeChild(log.firstChild); }
  var BLUE = '#62b8ff', GREEN = '#5fd6a4', RED = '#ff7a90';
  async function loop(id) {
    var n = 0, names = AS.provNames(), tools = ['Claude Code', 'Codex'];
    while (id === run) {
      var i = n++ % 2, fail = $('#failSw').getAttribute('aria-checked') === 'true';
      clear();
      if (!await travel(G.tw[i], BLUE, id)) return;
      if (!await travel(G.pw[0], fail ? RED : GREEN, id)) return;
      if (fail) {
        mark(G.prov[0], 'err', '503'); say(tools[i], names[0], '503', false);
        await wait(420); if (id !== run) return;
        if (!await travel(G.pw[1], GREEN, id)) return;
        mark(G.prov[1], 'ok', '200'); say(tools[i], t('cl.4.retry', { name: names[1] }), '200', true);
      } else { mark(G.prov[0], 'ok', '200'); say(tools[i], names[0], '200', true); }
      G.pkt.setAttribute('opacity', 0);
      await wait(1500);
    }
  }
  function start() {
    run++; build(); log.innerHTML = '';
    if (AS.reduce) {
      var names = AS.provNames();
      [G.tw[0], G.pw[0], G.pw[1]].forEach(function (w, i) { w.classList.add('lit'); w.style.setProperty('--c', i === 1 ? RED : i ? GREEN : BLUE); });
      mark(G.prov[0], 'err', '503'); mark(G.prov[1], 'ok', '200');
      say('Claude Code', names[0], '503', false); say('Claude Code', t('cl.4.retry', { name: names[1] }), '200', true);
      return;
    }
    loop(run);
  }
  document.addEventListener('as:provorder', start);
  $('#failSw').addEventListener('as:switch', function () { AS.toast(t(this.getAttribute('aria-checked') === 'true' ? 'cl.4.fail.on' : 'cl.4.fail.off')); });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if ((host.clientWidth < 520) !== vertical) start(); }, 200); });
  /* 滚到这一段再开始播 */
  if ('IntersectionObserver' in window && !AS.reduce) { build(); new IntersectionObserver(function (es, io) { if (es[0].isIntersecting) { io.disconnect(); start(); } }, { threshold: .3 }).observe(host); } else start();
})();
</script>
