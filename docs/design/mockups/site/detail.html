<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Store</title>
<script>(function(){var l,d=document.documentElement;try{l=JSON.parse(sessionStorage.getItem("as-proto-state")||"{}").lang}catch(e){}var q=/[?&]lang=(zh|en)/.exec(location.search);if(q)l=q[1];if(!l)l=/^zh/i.test(navigator.language||"")?"zh":"en";d.lang=l==="en"?"en":"zh-CN";d.classList.add("i18n-pending")})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
</head>
<body data-page="store">
<a class="skip" href="#main" data-i18n="skip">跳到正文</a>
<header class="nav" id="nav"></header>
<main id="main">

<section class="page-hero" style="padding-bottom:0">
  <div class="aurora low fade" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="wrap" id="detail"></div>
</section>
</main>
<footer class="footer" id="footer"></footer>
<script src="data.js"></script>
<script src="state.js"></script>
<script src="plans.js"></script>
<script src="i18n.js"></script>
<script src="proto.js"></script>

<script>
(function () {
  var $ = AS.$, esc = AS.esc, K = AS.K, root = $('#detail');
  var DEFAULT = 'mcp-registry:io.github.upstash/context7';
  function md(src) {
    var out = [], inCode = false, list = false, buf = [];
    function inline(x) { return esc(x).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
    function endList() { if (list) { out.push('</ul>'); list = false; } }
    src.split('\n').forEach(function (l) {
      if (/^```/.test(l)) { if (inCode) { out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); buf = []; } else endList(); inCode = !inCode; return; }
      if (inCode) return buf.push(l);
      var m;
      if ((m = /^(#{1,6})\s+(.*)/.exec(l))) { endList(); var h = m[1].length === 1 ? 'h3' : 'h4'; out.push('<' + h + '>' + inline(m[2]) + '</' + h + '>'); }
      else if ((m = /^\s*(?:[-*]|\d+\.)\s+(.*)/.exec(l))) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(m[1]) + '</li>'); }
      else if (l.trim()) { endList(); out.push('<p>' + inline(l) + '</p>'); }
      else endList();
    });
    if (inCode && buf.length) out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
    endList(); return out.join('');
  }
  function ext(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>' : esc(text); }
  function size(n) { return n == null ? '' : n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB'; }
  function render() {
    var h = AS.hash(), id = h.get('id') || DEFAULT, d = AS.byId(id);
    if (!d) {
      document.title = t('title.detail', { name: t('d.nf.h') });
      root.innerHTML = '<div class="gate"><h1 class="h2">' + t('d.nf.h') + '</h1><p class="muted">' + t('d.nf.p') + '</p><p><button class="btn btn-pri" type="button" data-open="palette">' + t('nav.search') + '</button>　<a class="btn btn-ghost" href="store.html">' + t('go.store') + '</a></p></div>'; return;
    }
    document.title = t('title.detail', { name: d.name });
    root.dataset.kind = d.kind;
    var compat = (d.compatible || ['claude', 'codex']).map(function (c) { return AS.TOOL[c]; }).join(AS_LANG === 'en' ? ', ' : '、');
    var specs = [[t('d.version'), esc(d.version)], [t('d.compat'), compat], [t('d.source'), t('d.src.' + d.kind)]];
    if (d.transports && d.transports.length) specs.push([t('d.transport'), esc(d.transports.join(', '))]);
    if (d.kind === 'skill') specs.push([t('d.files'), t('d.files.n', { n: d.fileCount })]);
    if (d.home) specs.push([t('d.home'), ext(d.home, d.home.replace(/^https:\/\//, '').replace(/\/$/, ''))]);
    if (d.repo) specs.push([t('d.repo'), ext(d.repo, 'GitHub')]);
    if (d.updated) specs.push([t('d.updated'), esc(d.updated)]);
    root.innerHTML =
      '<nav class="crumb" aria-label="' + t('d.crumb') + '"><a href="store.html">' + t('nav.store') + '</a><span>/</span><a href="store.html#kind=' + d.kind + '">' + t('kinds.' + d.kind) + '</a><span>/</span><span>' + esc(d.name) + '</span></nav>' +
      '<div class="d-head">' + AS.tile(d.kind) + '<div style="flex:1;min-width:0"><h1>' + esc(d.name) + '</h1>' +
      '<div class="d-meta"><span class="kind kind-pill">' + K(d.kind) + '</span><span>' + t('d.by') + ' ' + ext(d.authorUrl, d.author || t('unknown.author')) + '</span><span class="badge-inst" data-installed-badge="' + esc(d.id) + '" hidden>' + t('installed') + '</span></div>' +
      '<p class="desc">' + esc(d.description) + '</p></div></div>' +
      '<dl class="stats"><div><dt>' + t('d.installs') + '</dt><dd>' + AS.fmt(d.installs) + '</dd></div><div><dt>' + t('d.stars') + '</dt><dd>' + AS.fmt(d.stars) + '</dd></div><div><dt>' + t('d.version') + '</dt><dd class="sm">' + esc(d.version) + '</dd></div><div><dt>' + t('d.updated') + '</dt><dd class="sm">' + esc(d.updated || '—') + '</dd></div></dl>' +
      '<div class="d-grid"><div>' +
        '<section class="card"><h2>' + t('d.content') + '</h2>' + AS.runsHTML(d) + '</section>' +
        '<section class="card"><h2>' + t('d.where') + '</h2><p class="muted" style="font-size:14px">' + t('d.where.sub') + '</p>' + AS.writesHTML(d) + '</section>' +
        (d.kind === 'skill' && d.files ? '<section class="card"><h2>' + t('d.files') + '<span class="cap">' + t('d.files.n', { n: d.fileCount }) + '</span></h2><ul class="filetree">' + d.files.map(function (f) { return '<li><span>' + esc(f.path) + '</span><small>' + size(f.size) + '</small></li>'; }).join('') + '</ul></section>' : '') +
        '<section class="card"><h2>' + t(d.kind === 'skill' ? 'd.skill' : 'd.readme') + '<span class="cap">' + t('d.upstream') + '</span></h2>' +
          (d.readme ? '<div class="readme" lang="en">' + md(d.readme) + '</div><p class="readme-more">' + t('d.more') + ' ' + (d.repo ? AS.link(t('d.more.repo'), '<a href="' + esc(d.repo) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">') : '') + '</p>'
            : '<p class="muted" style="font-size:14.5px">' + t('d.noreadme') + ' ' + (d.repo ? AS.link(t('d.more.repo'), '<a href="' + esc(d.repo) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">') : '') + '</p>') + '</section>' +
      '</div><aside class="d-side">' +
        '<section class="card install-card"><div class="q-actions" style="margin-top:0"><button class="btn btn-pri" type="button" id="instBtn" data-install="' + esc(d.id) + '">' + t('d.install') + '</button>' + AS.heart(d.id) + '</div>' +
          '<p class="note">' + t('d.note') + '</p><h2 style="margin:18px 0 10px;font-size:14px;color:var(--fg2)">' + t('d.cmd') + '</h2>' + AS.codeHTML(d.command) + '</section>' +
        '<section class="card"><h2>' + t('d.specs') + '</h2><dl class="specs">' + specs.map(function (s) { return '<div><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>'; }).join('') + '</dl></section>' +
      '</aside></div>';
    AS.sync(root);
    if (!AS.S.has('recent', d.id)) { var r = AS.S.get().recent; r.unshift(d.id); r.length = Math.min(r.length, 5); AS.S.set({ recent: r }); }
    window.scrollTo(0, 0);
    if (h.get('open') === 'install') { h.delete('open'); history.replaceState(null, '', location.pathname + '#' + h.toString()); AS.install(d.id, $('#instBtn')); }
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
