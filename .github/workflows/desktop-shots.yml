name: desktop-shots

# Builds the Linux desktop client (test/desktop-linux/Dockerfile) and runs
# test/desktop-linux/shots.sh: the real window on Xvfb, the bundled aas sidecar
# behind Tauri IPC, the live test catalog. Then test/desktop-linux/appimage.sh
# in a fresh container: the AppImage's sidecar, scheme registration and an
# install link. test/desktop-linux/marketing.sh, in another fresh container, takes the
# website's client screenshots in Chinese and English. The screenshots and the on-disk
# checks are uploaded as the `desktop-shots` artifact.
on:
  pull_request:
    paths:
      - 'apps/cli-gui/**'
      - 'apps/cli/**'
      - 'apps/client-core/**'
      - 'packages/**'
      - 'test/desktop-linux/**'
      - '.github/workflows/desktop-shots.yml'
  workflow_dispatch:

concurrency:
  group: desktop-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Linux client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: test/desktop-linux/Dockerfile
          tags: as-desktop-linux
          load: true
          cache-from: type=gha,scope=desktop-linux
          cache-to: type=gha,scope=desktop-linux,mode=max
      - name: Screenshots of the native window
        run: |
          mkdir -p out
          docker run --rm --shm-size 1g -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/shots.sh
      - name: Marketing screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out/marketing
          docker run --rm --shm-size 1g -e OUT=/out/marketing -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/marketing.sh
      - name: AppImage
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out/appimage
          docker run --rm --shm-size 1g -e OUT=/out/appimage -v "$PWD/out:/out" --entrypoint bash as-desktop-linux /work/test/desktop-linux/appimage.sh
      - name: Result
        if: always()
        run: cat out/result.txt out/marketing/result.txt out/appimage/result.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shots
          path: out/
          retention-days: 14
