name: images

# Builds the API and store images. Pull requests only build (to catch a broken
# Dockerfile or `next build`); main also pushes them to ghcr.io with an
# immutable, sortable main-<UTC timestamp> tag. home-lab's Flux ImagePolicy picks
# the newest such tag and commits it to projects/agent-store/test.
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/store/**'
      - 'packages/**'
      - 'db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/store/**'
      - 'packages/**'
      - 'db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: store
            dockerfile: apps/store/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-store-${{ matrix.name }}
          tags: |
            type=raw,value=main-{{date 'YYYYMMDDHHmmss'}},enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The store bakes these into its browser bundle; the API ignores them.
          build-args: |
            NEXT_PUBLIC_API_URL=https://agent-store-test.panghuli.tech
            NEXT_PUBLIC_SITE_URL=https://agent-store-test.panghuli.tech
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
